name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Verify preconfigured Godot Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          java -version
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          test -f /root/debug.keystore
          test -f /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          test -f /root/.local/share/godot/export_templates/4.4.1.stable/android_release.apk

      - name: Configure Godot Android paths for runner user
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Import and validate project
        shell: bash
        run: godot --headless --editor --path . --quit

      - name: Run headless gameplay and asset tests
        shell: bash
        run: godot --headless --path . --script res://tests/run_headless.gd

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/CricketLegends26-debug.apk
          test -s build/CricketLegends26-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CricketLegends26-Android-debug
          path: build/CricketLegends26-debug.apk
          if-no-files-found: error
